<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f4f0e6;color:#14231f;font-family:Arial,sans-serif;padding:32px">
    <div style="max-width:560px;margin:0 auto;background:#fffaf0;border:1px solid #d8d0bf;border-radius:24px;padding:32px">
      <p style="margin:0 0 12px;color:#e3572d;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Campus Connect</p>
      <h1 style="margin:0 0 16px;color:#143c32;font-size:30px">确认邮箱，进入校园连接</h1>
      <p style="margin:0 0 24px;line-height:1.8;color:#49645d">点击下方按钮完成邮箱确认。确认后，你会回到 Campus Connect 并自动登录。</p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;border-radius:999px;background:#143c32;color:#fff;text-decoration:none;padding:14px 22px;font-weight:700">确认我的邮箱</a>
      <p style="margin:24px 0 0;color:#71827d;font-size:12px;line-height:1.7">如果这不是你的操作，可以忽略这封邮件。</p>
    </div>
  </body>
</html>
